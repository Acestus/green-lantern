<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blob Queue Table Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%92%BC%3C/text%3E%3C/svg%3E">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #faf9f8;
      color: #323130;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      color: #0078d4;
      border-bottom: 3px solid #0078d4;
      padding-bottom: 8px;
    }
    .nav { margin: 14px 0 20px; display: flex; gap: 12px; flex-wrap: wrap; }
    .nav a { color: #0078d4; text-decoration: none; font-weight: 600; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #d2d0ce;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #edebe9;
    }
    th {
      background: #0078d4;
      color: #fff;
    }
    tr:nth-child(even) { background: #f9f9f9; }
    .ok { color: #107c10; font-weight: 700; }
    .error { color: #a80000; font-weight: 700; margin-bottom: 12px; }
    .charts {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .chart-panel {
      background: #fff;
      border: 1px solid #d2d0ce;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      padding: 12px;
    }
    .chart-panel h2 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #106ebe;
      font-size: 18px;
    }
    .chart-wrap {
      min-height: 280px;
    }
    @media (max-width: 768px) {
      .charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Blob / Queue / Table Demo</h1>
    <div class="nav">
      <a href="/index.html">Home</a>
      <a href="/observability.html">App Insights</a>
      <a id="storageSiteLink" href="#" target="_blank" rel="noopener noreferrer">Storage Website</a>
    </div>
    <div id="status">Loading live storage data from Function API...</div>
    <table>
      <thead>
        <tr>
          <th>Service</th>
          <th>Source</th>
          <th>Status</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="storageRows"></tbody>
    </table>
    <div class="charts">
      <section class="chart-panel" aria-label="Storage counts chart">
        <h2>Storage service counts</h2>
        <div class="chart-wrap"><canvas id="storageCountsChart"></canvas></div>
      </section>
      <section class="chart-panel" aria-label="Data freshness chart">
        <h2>Freshness by source timestamp</h2>
        <div class="chart-wrap"><canvas id="storageFreshnessChart"></canvas></div>
      </section>
    </div>
  </div>
  <script src="./config.js"></script>
  <script>
    (function () {
      const cfg = window.HELLO_PORTAL_CONFIG || {};
      const storageWebBaseUrl = cfg.storageWebBaseUrl || "#";
      const storageLink = document.getElementById("storageSiteLink");
      if (storageLink) {
        storageLink.href = storageWebBaseUrl;
      }
    })();
  </script>
  <script type="module" src="./assets/data.js"></script>
</body>
</html>
