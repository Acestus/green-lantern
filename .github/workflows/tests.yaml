name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout green-lantern repo
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          output="$(dotnet test tests/HelloWorld.UnitTests/HelloWorld.UnitTests.csproj --configuration Release 2>&1)"
          exit_code=$?
          printf '%s\n' "$output"

          summary_line="$(printf '%s\n' "$output" | grep -E '^(Passed!|Failed!|Skipped!|Test Run Failed\.|Test Run Aborted\.)' | tail -n1)"
          passed="$(printf '%s\n' "$output" | sed -nE 's/.*Passed: *([0-9]+), Failed: *([0-9]+), Skipped: *([0-9]+), Total: *([0-9]+).*/\1/p' | tail -n1)"
          failed="$(printf '%s\n' "$output" | sed -nE 's/.*Passed: *([0-9]+), Failed: *([0-9]+), Skipped: *([0-9]+), Total: *([0-9]+).*/\2/p' | tail -n1)"
          skipped="$(printf '%s\n' "$output" | sed -nE 's/.*Passed: *([0-9]+), Failed: *([0-9]+), Skipped: *([0-9]+), Total: *([0-9]+).*/\3/p' | tail -n1)"
          total="$(printf '%s\n' "$output" | sed -nE 's/.*Passed: *([0-9]+), Failed: *([0-9]+), Skipped: *([0-9]+), Total: *([0-9]+).*/\4/p' | tail -n1)"

          passed="${passed:-0}"
          failed="${failed:-0}"
          skipped="${skipped:-0}"
          total="${total:-0}"

          {
            echo "## Unit Tests"
            echo ""
            echo "- Status: $([ "$exit_code" -eq 0 ] && echo Passed || echo Failed)"
            echo "- Passed: $passed"
            echo "- Failed: $failed"
            echo "- Skipped: $skipped"
            echo "- Total: $total"
            if [ -n "$summary_line" ]; then
              echo "- Summary: \`$summary_line\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$exit_code"

  acceptance-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout green-lantern repo
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run acceptance tests
        shell: bash
        run: |
          set +e
          output="$(dotnet test tests/HelloWorld.AcceptanceTests/HelloWorld.AcceptanceTests.csproj --configuration Release 2>&1)"
          exit_code=$?
          printf '%s\n' "$output"

          summary_line="$(printf '%s\n' "$output" | grep -E '^(Passed!|Failed!|Skipped!|Test Run Failed\.|Test Run Aborted\.)' | tail -n1)"
          passed="$(printf '%s\n' "$output" | sed -nE 's/.*Passed: *([0-9]+), Failed: *([0-9]+), Skipped: *([0-9]+), Total: *([0-9]+).*/\1/p' | tail -n1)"
          failed="$(printf '%s\n' "$output" | sed -nE 's/.*Passed: *([0-9]+), Failed: *([0-9]+), Skipped: *([0-9]+), Total: *([0-9]+).*/\2/p' | tail -n1)"
          skipped="$(printf '%s\n' "$output" | sed -nE 's/.*Passed: *([0-9]+), Failed: *([0-9]+), Skipped: *([0-9]+), Total: *([0-9]+).*/\3/p' | tail -n1)"
          total="$(printf '%s\n' "$output" | sed -nE 's/.*Passed: *([0-9]+), Failed: *([0-9]+), Skipped: *([0-9]+), Total: *([0-9]+).*/\4/p' | tail -n1)"

          passed="${passed:-0}"
          failed="${failed:-0}"
          skipped="${skipped:-0}"
          total="${total:-0}"

          {
            echo "## Acceptance Tests"
            echo ""
            echo "- Status: $([ "$exit_code" -eq 0 ] && echo Passed || echo Failed)"
            echo "- Passed: $passed"
            echo "- Failed: $failed"
            echo "- Skipped: $skipped"
            echo "- Total: $total"
            if [ -n "$summary_line" ]; then
              echo "- Summary: \`$summary_line\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$exit_code"
