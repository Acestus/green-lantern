name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SWA_APP_LOCATION: swa/hello-portal

jobs:
  bicep:
    name: Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout green-lantern repo
        uses: actions/checkout@v5

      - name: Setup Azure CLI
        uses: azure/CLI@v3
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            az bicep build --file infrastructure/main.bicep
            test -f infrastructure/main.json

      - name: Upload compiled Bicep
        uses: actions/upload-artifact@v4
        with:
          name: bicep-main-json
          path: infrastructure/main.json

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout green-lantern repo
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ./hello-world/HelloWorld.csproj

      - name: Build function app
        run: dotnet build ./hello-world/HelloWorld.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/HelloWorld.UnitTests/HelloWorld.UnitTests.csproj --configuration Release --logger trx --results-directory TestResults/unit

      - name: Run acceptance tests
        run: dotnet test tests/HelloWorld.AcceptanceTests/HelloWorld.AcceptanceTests.csproj --configuration Release --logger trx --results-directory TestResults/acceptance

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/**/*.trx

      - name: Publish function package
        run: dotnet publish ./hello-world/HelloWorld.csproj --configuration Release --output ./artifacts/function

      - name: Upload function package
        uses: actions/upload-artifact@v4
        with:
          name: function-publish
          path: artifacts/function

  static-web-app:
    name: Static Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout green-lantern repo
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ env.SWA_APP_LOCATION }}
        run: bun install --frozen-lockfile

      - name: Typecheck vanilla TypeScript
        working-directory: ${{ env.SWA_APP_LOCATION }}
        run: bun run typecheck

      - name: Build browser assets
        working-directory: ${{ env.SWA_APP_LOCATION }}
        run: bun run build

      - name: Check static site files
        working-directory: ${{ env.SWA_APP_LOCATION }}
        run: |
          set -euo pipefail
          test -f index.html
          test -f staticwebapp.config.json
          test -f assets/data.js
          test -f assets/observability.js
          rg --files -g '*.html' | sort

      - name: Upload SWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-web-app
          path: ${{ env.SWA_APP_LOCATION }}

  deployment-readiness:
    name: Deployment readiness
    runs-on: ubuntu-latest
    needs:
      - bicep
      - dotnet
      - static-web-app

    steps:
      - name: Publish readiness summary
        run: |
          {
            echo "## CI/CD readiness"
            echo ""
            echo "- Bicep compiled successfully."
            echo "- Azure Functions restored, built, tested, and published."
            echo "- Static Web App TypeScript typechecked and bundled."
            echo "- Deploy workflows can publish infrastructure, Functions, storage reports, and SWA after this gate is green."
          } >> "$GITHUB_STEP_SUMMARY"
